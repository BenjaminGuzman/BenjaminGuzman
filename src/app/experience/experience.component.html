<p class="text-2xl md:text-3xl font-bold text-center text-color mb-2 mt-4 scroll-mt-4" id="experience">Professional Experience</p>
<p class="text-center text-color sans-serif">My career journey.<br/>
  For a more detailed resume, feel free to reach out via the contact form below.</p>
<div class="grid gap-8 items-center grid-cols-1 max-w-5xl mx-auto px-6 lg:px-10 py-8">

  <div *ngFor="let role of renderedRoles" @fadeIn class="glass p-6 rounded shadow-lg hover:shadow-neon transition-shadow text-color h-full border border-gray-400 dark:border-gray-700">
    <div class="flex justify-between items-start mb-2">
      <div>
        <h3 class="text-lg md:text-xl font-bold text-green-700 dark:text-green-500">{{role.title}}</h3>
        <h4 class="font-medium text-gray-700 dark:text-gray-300 sans-serif">{{role.company}}</h4>
      </div>
      <span class="text-sm text-gray-500 font-medium sans-serif text-right">{{role.date}}</span>
    </div>
<!--    <ul class="list-disc list-outside ml-4 space-y-2 text-justify sans-serif mt-4">-->
<!--      <li *ngFor="let point of role.points">{{point}}</li>-->
<!--    </ul>-->
  </div>

</div>
<div class="w-full h-18 py-4 mb-8">
  <button class="flex justify-center text-lg items-end gap-1 mx-auto px-2 py-1 dark:border-white border-black border-t-2 border-b-2 fancy-btn-hover text-color"
          [ngClass]="{'hidden': roles.length === 0}"
          (click)="loadMore()">
    <span class="text-lg font-medium">Load more</span>
    <span class="material-icons material-icons-outlined">expand_more</span>
  </button>
</div>
