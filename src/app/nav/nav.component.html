<header [@headerAnimation]="headerAnimationState"
        class="w-full h-14 fixed z-40 flex justify-between px-3 md:px-8 lg:px-12 xl:px-16 glass">
  <div class="flex gap-2 items-center">
    <img src="/assets/profile.webp" alt="Benjamín Guzmán" class="w-10 h-10 rounded-full border-gray-400 border" width="40" height="40">
    <span class="font-medium text-lg md:text-xl">Benjamín Guzmán</span>
  </div>
  <div class="flex gap-4">
    <div class="hidden lg:block">
      <ng-container *ngTemplateOutlet="navRef"></ng-container>
    </div>
    <button [title]="isDarkModeEnabled() ? 'Experimental!' : ''" (click)="toggleDarkMode()">
      <span class="material-icons material-icons-outlined">{{nextColorModeIcon}}</span>
    </button>
    <button class="block lg:hidden" (click)="toggleNavMenu()"> <!-- menu button for small screens -->
      <span class="material-icons material-icons-outlined">{{nextMenuStateIcon}}</span>
    </button>
  </div>
</header>
<div class="w-full h-full z-30 fixed lg:hidden gap-4 lg:gap-8 items-center pt-14 glass"
     id="menu-sm"
     [@menuAnimation]="menuAnimationState">
  <ng-container *ngTemplateOutlet="navRef"></ng-container>
</div>

<ng-template #navRef>
  <nav class="h-full lg:mt-auto flex flex-col lg:flex-row lg:gap-6 justify-around lg:justify-center items-center text-color lg:text-lg">
    <a class="transition-all cursor-pointer link before:bg-gray-700 dark:before:bg-gray-300 hover:[text-shadow:0_0_8px_rgba(34,197,94,0.8)] hover:text-green-500 dark:hover:text-green-400"
       [ngClass]="{'scale-110 text-green-600 dark:text-green-400 link-active': isFragmentActive('about')}"
       routerLink="./"
       (click)="navigateTo('about')">
      About
    </a>
    <a class="transition-all cursor-pointer link before:bg-gray-700 dark:before:bg-gray-300 hover:[text-shadow:0_0_8px_rgba(34,197,94,0.8)] hover:text-green-500 dark:hover:text-green-400"
       [ngClass]="{'scale-110 text-green-600 dark:text-green-400 link-active': isFragmentActive('portfolio')}"
       routerLink="./"
       (click)="navigateTo('portfolio')">
      Portfolio
    </a>
    <a class="transition-all cursor-pointer link before:bg-gray-700 dark:before:bg-gray-300 hover:[text-shadow:0_0_8px_rgba(34,197,94,0.8)] hover:text-green-500 dark:hover:text-green-400"
       [ngClass]="{'scale-110 text-green-600 dark:text-green-400 link-active': isFragmentActive('papers')}"
       routerLink="./"
       (click)="navigateTo('papers')">
      Papers
    </a>
    <a class="transition-all cursor-pointer link before:bg-gray-700 dark:before:bg-gray-300 hover:[text-shadow:0_0_8px_rgba(34,197,94,0.8)] hover:text-green-500 dark:hover:text-green-400"
       [ngClass]="{'scale-110 text-green-600 dark:text-green-400 link-active': isFragmentActive('experience')}"
       routerLink="./"
       (click)="navigateTo('experience')">
      Experience
    </a>
    <a class="transition-all cursor-pointer link before:bg-gray-700 dark:before:bg-gray-300 hover:[text-shadow:0_0_8px_rgba(34,197,94,0.8)] hover:text-green-500 dark:hover:text-green-400"
       [ngClass]="{'scale-110 text-green-600 dark:text-green-400 link-active': isFragmentActive('skills')}"
       routerLink="./"
       (click)="navigateTo('skills')">
      Skills
    </a>
    <a class="transition-all cursor-pointer link before:bg-gray-700 dark:before:bg-gray-300 hover:[text-shadow:0_0_8px_rgba(34,197,94,0.8)] hover:text-green-500 dark:hover:text-green-400"
       [ngClass]="{'scale-110 text-green-600 dark:text-green-400 link-active': isFragmentActive('footer')}"
       routerLink="./"
       (click)="navigateTo('footer')">
      Contact
    </a>
    <a class="transition-all cursor-pointer link before:bg-gray-700 dark:before:bg-gray-300 hover:[text-shadow:0_0_8px_rgba(34,197,94,0.8)] hover:text-green-500 dark:hover:text-green-400"
       href="https://medium.com/@GuzmanBenjamin"
       target="_blank">
      Blog
    </a>
  </nav>
</ng-template>
